name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "এই রিপোতে অবদান রাখা জন্য ধন্যবাদ। Thank You."
        pr-message: "হেই, দারুণ। পুল রিকোয়েস্টের জন্য ধন্যবাদ।"
